[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "data-watch-lab"
version = "0.1.0"
description = "Detecção de anomalias com avaliação temporal e ingestão idempotente"
requires-python = ">=3.11"
dependencies = ["scikit-learn>=1.5,<2", "numpy>=1.26,<3", "joblib>=1.4,<2", "fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

