name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-deps -e .
      - run: pytest -q
      - run: python -m data_watch train --model /tmp/data-watch.joblib
      - run: python -m data_watch evaluate --model /tmp/data-watch.joblib --report /tmp/evaluation.json

